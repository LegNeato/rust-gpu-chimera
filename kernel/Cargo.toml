[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = { version = "0.30", default-features = false, features = ["libm"] }

shared = { path = "../shared" }

[target.'cfg(target_arch = "spirv")'.dependencies]
spirv-std = { git = "https://github.com/rust-gpu/rust-gpu", rev = "ddb039b" }

[target.'cfg(target_os = "cuda")'.dependencies]
cuda_std = { git = "https://github.com/Rust-GPU/Rust-CUDA", rev = "0bc607f", default-features = false }

[target.'cfg(not(any(target_arch = "spirv", target_os = "cuda")))'.dependencies]
rayon = "1.7"

[lints]
workspace = true
